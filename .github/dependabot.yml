version: 2
updates:
  # Python dependencies, pinned in uv.lock. Daily, so a new MarkItDown release
  # shows up as a pull request the next morning. Green non-majors squash-merge
  # themselves (see .github/workflows/dependabot.yml); majors wait for a look.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      # MarkItDown gets its own pull request. Everything else lands as one.
      other-python:
        patterns: ["*"]
        exclude-patterns: ["markitdown"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
